# Example deployment for dgcosenza/phpmyadmin
# Bind to loopback or place behind an authenticated reverse proxy.

services:
  phpmyadmin:
    image: dgcosenza/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 256M
    environment:
      - PMA_HOST=db
      - PMA_ARBITRARY=0
      - UPLOAD_LIMIT=64M
      - TZ=UTC
    volumes:
      - ./config.user.inc.php:/etc/phpmyadmin/config.user.inc.php:ro
    networks:
      - db_pma_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

networks:
  db_pma_net:
    driver: bridge
    internal: true
